<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<link rel="manifest" href="manifest.webmanifest">
<title>Tama P-COM Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="square">
  <header>Tama P-COM</header>
  <section class="content">
    <div class="card">
      <h1>Tamagotchi Paradise</h1>
      <p id="support">Chrome Web Serial / USB</p>
      <div class="row">
        <button id="connect">Connect</button>
        <button id="disconnect" disabled>Disconnect</button>
      </div>
      <div class="status"><span id="dot"></span><span id="status">未接続</span></div>
      <label class="file">
        <input id="file" type="file" accept=".bin,.arc2,application/octet-stream">
        <span id="fileName">BIN / ARC2 を選択</span>
      </label>
      <button id="send" class="send" disabled>たまごっちへ送信</button>
      <progress id="progress" value="0" max="1"></progress>
      <div class="log" id="log"></div>
    </div>
  </section>
  <footer>Offline-ready • 460800 8N1</footer>
</main>
<script src="app.js"></script>
</body>
</html>
