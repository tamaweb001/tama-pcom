<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-COM UART Diagnostic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>P-COM UART TEST</h1>
  <div id="status" class="status"><span id="dot"></span> 未接続</div>

  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
  </div>

  <section>
    <h2>Serial</h2>
    <div class="grid">
      <label>Baud
        <select id="baud">
          <option>460800</option>
          <option>115200</option>
          <option>230400</option>
          <option>921600</option>
        </select>
      </label>
      <label>DTR
        <select id="dtr"><option value="off">OFF</option><option value="on">ON</option></select>
      </label>
      <label>RTS
        <select id="rts"><option value="off">OFF</option><option value="on">ON</option></select>
      </label>
    </div>
    <div id="device">Device: —</div>
  </section>

  <section>
    <h2>Send ASCII</h2>
    <input id="ascii" value="ECHO REQ">
    <div class="row">
      <button id="sendAscii" disabled>送信（CRLF）</button>
      <button id="sendRawAscii" disabled>送信（そのまま）</button>
    </div>
  </section>

  <section>
    <h2>Send HEX</h2>
    <input id="hex" value="45 43 48 4F 20 52 45 51 0D 0A">
    <button id="sendHex" disabled>HEX送信</button>
  </section>

  <section>
    <h2>RX / TX Log</h2>
    <pre id="log"></pre>
  </section>

  <section class="stats">
    <span>TX: <b id="txCount">0</b> bytes</span>
    <span>RX: <b id="rxCount">0</b> bytes</span>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
